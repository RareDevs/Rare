name: _job_cx-freeze-appimage

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            pyarch: arm64
            os: ubuntu-24.04-arm
          - arch: x86_64
            pyarch: x64
            os: ubuntu-24.04
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: '3.14'
          check-latest: true
          architecture: ${{ matrix.pyarch }}
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install patchelf fakeroot
          pip3 install --upgrade git+https://github.com/marcelotduarte/cx_Freeze.git
          pip3 install --upgrade ruff
      - name: Install target dependencies
        run: |
          pip3 install -r packaging/requirements.in
      - name: Prepare
        shell: bash
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin +refs/tags/*:refs/tags/*
          ./tools/ui2py.sh --force
          ./tools/qrc2py.sh --force
          ./tools/ts2qm.py
          python3 -m setuptools_scm --force-write-version-files
      - name: Build
        id: build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          basename: Rare-${{ inputs.version }}-${{ matrix.arch }}
        run: |
          python3 freeze.py bdist_appimage --updateinformation="gh-releases-zsync|RareDevs|Rare|latest-all|Rare*-${{ matrix.arch }}.AppImage.zsync"
          mv dist/Rare-*.AppImage ${{ env.basename }}.AppImage
          mv dist/Rare-*.AppImage.zsync ${{ env.basename }}.AppImage.zsync
          echo "basename=${{ env.basename }}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.basename }}.AppImage
          path: ${{ steps.build.outputs.basename }}.AppImage
          if-no-files-found: error
          archive: false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.basename }}.AppImage.zsync
          path: ${{ steps.build.outputs.basename }}.AppImage.zsync
          if-no-files-found: error
          archive: false
