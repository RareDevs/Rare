name: _job_cx-freeze-msi

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            pyarch: arm64
            os: windows-11-arm
          - arch: x86_64
            pyarch: x64
            os: windows-latest
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-python
        with:
          architecture: ${{ matrix.pyarch }}
      - name: Install build dependencies
        run: |
          pip3 install --upgrade cx_freeze ruff
      - name: Install target dependencies
        run: |
          pip3 install -r packaging/requirements.in
      - name: Prepare
        shell: bash
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin +refs/tags/*:refs/tags/*
          ./tools/ui2py.sh --force
          ./tools/qrc2py.sh --force
          ./tools/ts2qm.py
          python3 -m setuptools_scm --force-write-version-files
      - name: Build
        id: build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          basename: Rare-${{ inputs.version }}-${{ matrix.arch }}
        run: |
          python3 freeze.py bdist_msi
          mv dist/*.msi ${{ env.basename }}.msi
          echo "basename=${{ env.basename }}" >> $ENV:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.basename }}.msi
          path: ${{ steps.build.outputs.basename }}.msi
          if-no-files-found: error
          archive: false
