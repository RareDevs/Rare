name: _job_cx-freeze-macos

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            pyarch: arm64
            os: macos-15
          - arch: x86_64
            pyarch: x64
            os: macos-15-intel
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: '3.13'
          check-latest: true
          architecture: ${{ matrix.pyarch }}
      - name: Install build dependencies
        env:
          NONINTERACTIVE: 1
        run: |
          sudo /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)"
          sudo rm -rfv /opt/homebrew/
          pip3 install --upgrade cx_freeze ruff
      - name: Install target dependencies
        run: |
          pip3 install -r packaging/requirements.in
      - name: Prepare
        shell: bash
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin +refs/tags/*:refs/tags/*
          ./tools/ui2py.sh --force
          ./tools/qrc2py.sh --force
          ./tools/ts2qm.py
          python3 -m setuptools_scm --force-write-version-files
      - name: Build
        id: build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          basename: Rare-${{ inputs.version }}-${{ matrix.arch }}
        run: |
          python3 freeze.py bdist_dmg
          mv build/Rare.dmg ${{ env.basename }}.dmg
          echo "basename=${{ env.basename }}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.basename }}.dmg
          path: ${{ steps.build.outputs.basename }}.dmg
          if-no-files-found: error
          archive: false
