name: _job_nuitka-win

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            pyarch: arm64
            os: windows-11-arm
          - arch: x86_64
            pyarch: x64
            os: windows-latest
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: '3.14'
          check-latest: true
          architecture: ${{ matrix.pyarch }}
      - name: Install build dependencies
        run: |
          pip3 install --upgrade nuitka ruff
      - name: Install target dependencies
        run: |
          pip3 install -r packaging/requirements.in
      - name: Prepare
        shell: bash
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin +refs/tags/*:refs/tags/*
          ./tools/ui2py.sh --force
          ./tools/qrc2py.sh --force
          ./tools/ts2qm.py
          python3 -m setuptools_scm --force-write-version-files
      - name: Build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: >-
          python -m nuitka
          --assume-yes-for-downloads
          --disable-ccache
          --show-scons
          --msvc=latest
          --lto=no
          --jobs=4
          --static-libpython=no
          --standalone
          --enable-plugin=anti-bloat
          --enable-plugin=pyside6
          --enable-plugin=multiprocessing
          --no-deployment-flag=self-execution
          --show-modules
          --show-anti-bloat-changes
          --follow-stdlib
          --follow-imports
          --nofollow-import-to="*.tests"
          --nofollow-import-to="*.distutils"
          --nofollow-import-to="distutils"
          --nofollow-import-to="unittest"
          --nofollow-import-to="pydoc"
          --nofollow-import-to="tkinter"
          --nofollow-import-to="test"
          --prefer-source-code
          --include-package=pypresence
          --include-package-data=qtawesome
          --include-data-dir=rare\resources\images\=rare\resources\images\
          --include-data-files=rare\resources\languages\rare_*.qm=rare\resources\languages\
          --output-filename=Rare.exe
          --file-description=Rare.exe
          --company-name=RareDevs
          --product-name=Rare
          --file-version=${{ inputs.version }}
          --product-version=${{ inputs.version }}
          --windows-console-mode=disable
          --windows-icon-from-ico=rare\resources\images\Rare.ico
          rare
      - name: Compress
        id: compress
        shell: bash
        env:
          basename: Rare-${{ inputs.version }}-${{ matrix.arch }}-windows
        run: |
          mv rare.dist ${{ env.basename }}
          python -c "import shutil; fn='${{ env.basename }}'; shutil.make_archive(fn, 'zip', '.', fn)"
          echo "basename=${{ env.basename }}" >> $GITHUB_OUTPUT
      - name: Innosetup
        id: innosetup
        shell: bash
        env:
          INNOSETUP_PACKAGE_ARCH: ${{ matrix.arch }}
          INNOSETUP_PACKAGE_FILES: ${{ steps.compress.outputs.basename }}
          INNOSETUP_PACKAGE_VERSION: ${{ inputs.version }}
          basename: Rare-${{ inputs.version }}-${{ matrix.arch }}-setup
        run: |
          python packaging/innosetup/package.py
          mv build/${{ env.basename }}.exe ${{ env.basename }}.exe
          echo "basename=${{ env.basename }}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.compress.outputs.basename }}.zip
          path: ${{ steps.compress.outputs.basename }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.innosetup.outputs.basename }}.exe
          path: ${{ steps.innosetup.outputs.basename }}.exe
          if-no-files-found: error
          archive: false
